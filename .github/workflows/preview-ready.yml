name: Guardian preview ready
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Verify deployed runtime matches this commit
        run: node scripts/verify-preview.mjs
